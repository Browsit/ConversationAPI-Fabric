plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

def jitProps = gradle.startParameter.projectProperties
version = jitProps['version'] ?: project.mod_version
group = jitProps['group'] ?: project.maven_group

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://libraries.minecraft.net/" }
    maven { url = "https://jitpack.io" }
}

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

configurations {
    // Fabric API is never shipped and never required by the installed mod: it is absent from
    // fabric.mod.json and from the published POM (generated off runtimeElements). It is only
    // needed (a) to compile, because adventure-platform-fabric's class signatures reference
    // fabric-api types, and (b) for dev runs, because adventure-platform-fabric is a Fabric mod
    // that hard-depends on fabric-api-base / fabric-command-api-v2.
    fabricApiDevOnly
    runtimeClasspath {
        extendsFrom fabricApiDevOnly
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    compileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    fabricApiDevOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation("net.kyori:adventure-platform-fabric:${project.adventure_platform_version}") {
        // adventure-platform-fabric declares fabric-api modules as maven dependencies; keep them off
        // the runtime classpath (and out of our published POM) so nothing requires Fabric API.
        exclude group: "net.fabricmc.fabric-api"
    }
    implementation "net.kyori:adventure-text-serializer-legacy:${project.adventure_version}"

    implementation("com.github.Browsit.ConversationAPI:api:${project.conversation_version}") {
        changing = true
        exclude group: "net.kyori", module: "adventure-platform-api"
        exclude group: "net.kyori", module: "adventure-api"
    }
    implementation("com.github.Browsit.ConversationAPI:impl:${project.conversation_version}") {
        changing = true
        exclude group: "net.kyori", module: "adventure-platform-api"
        exclude group: "net.kyori", module: "adventure-api"
        exclude group: "net.kyori", module: "adventure-text-serializer-legacy"
    }

    // api/impl are plain libraries (not Fabric mods), so bundle them inside this mod jar;
    // otherwise a standalone install has nowhere to get org.browsit.conversations.api.* from.
    include("com.github.Browsit.ConversationAPI:api:${project.conversation_version}") {
        changing = true
        transitive = false
        exclude group: "net.kyori", module: "adventure-platform-api"
        exclude group: "net.kyori", module: "adventure-api"
    }
    include("com.github.Browsit.ConversationAPI:impl:${project.conversation_version}") {
        changing = true
        transitive = false
        exclude group: "net.kyori", module: "adventure-platform-api"
        exclude group: "net.kyori", module: "adventure-api"
        exclude group: "net.kyori", module: "adventure-text-serializer-legacy"
    }
    include("net.kyori:adventure-text-serializer-legacy:${project.adventure_version}") {
        transitive = false
    }

    implementation fileTree(dir: "libs", include: ["*.jar"])
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    options.release = targetJavaVersion
    options.encoding = "UTF-8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

base {
    archivesName = project.archives_base_name
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}